<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration - Ethos Sustainability</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .registration-hero {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            color: white;
            padding: 4rem 0;
            text-align: center;
        }

        .registration-form-section {
            padding: 4rem 0;
            background: var(--bg-white);
        }

        .form-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: -6rem auto 0;
            position: relative;
            z-index: 10;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- Simplified Navigation - Logo Only -->
    <nav class="navbar">
        <div class="container" style="justify-content: center;">
            <div class="nav-brand">
                <a href="index.html">
                    <h1>Ethos Sustainability</h1>
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="registration-hero">
        <div class="container">
            <h1 class="hero-title" style="font-size: 2.5rem;">Conference Registration</h1>
            <p class="hero-subtitle">UNT Architecture & Sustainability Conference</p>
        </div>
    </header>

    <!-- Registration Form Section -->
    <section class="registration-form-section">
        <div class="container">
            <div class="form-card">
                <iframe
                    src="https://docs.google.com/forms/d/e/1FAIpQLSea0UPHG8eQhhJ8iLceLoO7scyoe1M13SSvgOcSSXb7rzfGsQ/viewform?embedded=true"
                    width="100%" height="1580" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content" style="justify-content: center; text-align: center;">
                <div class="footer-brand">
                    <h3>Ethos Sustainability</h3>
                    <p style="margin-top: 1rem; opacity: 0.7;">Empowering the next generation of sustainable innovators.
                    </p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; Ethos Sustainable Business and STEAM Education</p>
            </div>
        </div>
    </footer>

</body>

</html>
